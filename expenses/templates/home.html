{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="icon" href="{% static 'images/favicon.ico' %}">
</head>
<style>

        body{
            font-family: Arial;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1{
            color: darkblue;
        }

        button{
            padding: 10px;
            margin: 5px;
            cursor: pointer;
        }

        table{
            border-collapse: collapse;
            width: 70%;
            background: white;
        }
        a{
            text-decoration: none;
        }

        th, td{
            border: 1px solid gray;
            padding: 10px;
            text-align: center;
        }

</style>
<body>
    <center><h1>🤑Expense Tracker💸</h1></center>

    <h2>Total Expense: ₹{{ total }}</h2>

    <a href="/add/"> 
        <button>Add Expense➕</button>
    </a>

    <a href="/chart/">
        <button>Expense Chart📊</button>
    </a>

    <h2>All Expenses</h2>
    
    <table>
        <tr>
            <th>Title</th>
            <th>Amount</th>
            <th>Category</th>
            <th>Date</th>
            <th>Edit</th>
        </tr>
    
        {% for expense in expenses %}
        
        <tr>
        
            <td>{{ expense.title }}</td>
            <td>{{ expense.amount }}</td>
            <td>{{ expense.category }}</td>
            <td>{{ expense.date }}</td>
            <td>    
                    <a href="/edit/{{ expense.id }}/">    
                        <button>Edit</button>    
                </a>    
            </td>
        </tr>
    
        {% endfor %}
    
    </table>

    
</body>
</html>
